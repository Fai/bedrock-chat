version: 0.2

# CodeBuild spec for ARM64 AgentCore runtime container
# Builds and pushes container to ECR for AgentCore deployment

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      - REPOSITORY_URI=$ECR_REPOSITORY_URI
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo Build started on `date`
      - echo Building the Docker image for ARM64...

  build:
    commands:
      - echo Build started on `date`
      - echo Building ARM64 Docker image
      # Use buildx for cross-platform ARM64 build
      - docker buildx create --use --name arm64-builder --driver docker-container
      - docker buildx build --platform linux/arm64 -t $REPOSITORY_URI:latest -t $REPOSITORY_URI:$IMAGE_TAG --push backend/agentcore_runtime/

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - echo Image URI $REPOSITORY_URI:$IMAGE_TAG

artifacts:
  files:
    - '**/*'
  name: agentcore-runtime-$(date +%Y-%m-%d)

cache:
  paths:
    - '/root/.docker/**/*'
